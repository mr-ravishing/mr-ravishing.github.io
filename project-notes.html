<style>
:root{
  --paper:#F5F8F9; --grid:#E0E8EC; --grid-major:#C9D6DC;
  --chrome:#FFFFFF; --chrome-2:#EEF2F4; --line:#D6DEE2;
  --text:#15202A; --muted:#566673;
  --accent:#2346C8; --accent-ink:#FFFFFF; --accent-soft:#E5EAFB;
  --red:#C8312A;
  --ink0:#1A2230; --ink1:#2346C8; --ink2:#C8312A; --ink3:#1F7A4D;
  --sheet-shadow:0 -10px 30px rgba(20,32,42,.14);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C2925; --grid:rgba(235,245,240,.055); --grid-major:rgba(235,245,240,.1);
    --chrome:#141D1A; --chrome-2:#1B2622; --line:#2A3833;
    --text:#E7EEEA; --muted:#97A8A0;
    --accent:#93B0FF; --accent-ink:#0F1A3A; --accent-soft:#22305A;
    --red:#FF8F84;
    --ink0:#EEF3EF; --ink1:#9DB8FF; --ink2:#FF9B8F; --ink3:#8FD9A8;
    --sheet-shadow:0 -10px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C2925; --grid:rgba(235,245,240,.055); --grid-major:rgba(235,245,240,.1);
  --chrome:#141D1A; --chrome-2:#1B2622; --line:#2A3833;
  --text:#E7EEEA; --muted:#97A8A0;
  --accent:#93B0FF; --accent-ink:#0F1A3A; --accent-soft:#22305A;
  --red:#FF8F84;
  --ink0:#EEF3EF; --ink1:#9DB8FF; --ink2:#FF9B8F; --ink3:#8FD9A8;
  --sheet-shadow:0 -10px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--chrome);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--chrome-2);color:var(--text);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  -webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:4px;padding:8px 10px;background:var(--chrome);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.toolbar::-webkit-scrollbar{display:none}
.brand{font-weight:700;font-size:1.15rem;letter-spacing:-.01em;padding:0 10px 0 4px;white-space:nowrap}
.grp{display:flex;align-items:center;gap:2px;padding:0 6px;border-left:1px solid var(--line);flex:none}
.spacer{flex:1 1 8px;min-width:8px}
.tb{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:var(--text);flex:none}
.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb:hover{background:var(--chrome-2)}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tb:disabled{opacity:.35;cursor:default;background:transparent}
.tb.armed{background:var(--red);color:#fff}
.swatch{width:34px;height:40px;border:0;background:transparent;display:grid;place-items:center;flex:none;border-radius:10px}
.swatch span{width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.swatch[aria-pressed="true"] span{box-shadow:0 0 0 2px var(--chrome),0 0 0 4px var(--c)}
.size span{display:block;border-radius:50%;background:currentColor}
.pglabel{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem;white-space:nowrap}

/* Main */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(310px,350px);min-height:0;position:relative}
.board{position:relative;min-width:0;min-height:0;overflow:hidden;background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-major) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.board.erasing #cv{cursor:cell}
.hint-empty{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);color:var(--muted);text-align:center;pointer-events:none;
  font-size:1.05rem;max-width:32ch;opacity:.85}
.hint-empty[hidden]{display:none}
.totop{position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:var(--chrome);color:var(--text);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.totop[hidden]{display:none}
.totop svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Calculator panel */
.panel{display:flex;flex-direction:column;min-height:0;background:var(--chrome);border-left:1px solid var(--line)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 8px 16px}
.panel-head h2{font-size:1.02rem;margin:0}
.head-r{display:flex;align-items:center;gap:6px}
.angle{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.angle button{border:0;background:transparent;padding:5px 11px;font-size:.88rem;color:var(--muted)}
.angle button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.hist{flex:1 1 auto;min-height:60px;overflow:auto;padding:4px 10px 8px;border-top:1px solid var(--line);display:flex;flex-direction:column}
.hist .empty{color:var(--muted);font-size:.92rem;padding:10px 6px;margin:auto 0 0}
.h-item{display:block;width:100%;text-align:right;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
.h-item:hover{background:var(--chrome-2)}
.h-item:first-of-type{margin-top:auto}
.h-e{display:block;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.h-r{display:block;font-size:1.12rem;font-weight:700;overflow-wrap:anywhere}
.hist-clear{border:0;background:transparent;color:var(--muted);font-size:.85rem;padding:4px 8px;align-self:flex-start;border-radius:6px}
.hist-clear[hidden]{display:none}
.display{padding:8px 14px 10px;border-top:1px solid var(--line)}
.display input{width:100%;border:0;background:transparent;font-size:1.5rem;text-align:right;padding:2px 2px;font-variant-numeric:tabular-nums;outline:none}
.preview{min-height:1.4em;text-align:right;color:var(--muted);font-size:1rem;font-variant-numeric:tabular-nums;padding-right:2px;overflow-wrap:anywhere}
.preview.err{color:var(--red)}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:0 10px 12px}
.key{height:46px;border:0;border-radius:10px;background:var(--chrome-2);color:var(--text);font-size:1.05rem;padding:0}
.key.fn{font-size:.92rem;background:transparent;border:1px solid var(--line)}
.key.op{background:var(--accent-soft);color:var(--accent);font-size:1.2rem;font-weight:700}
.key.eq{background:var(--accent);color:var(--accent-ink);font-size:1.4rem;font-weight:700;grid-column:5/7;grid-row:5/7;height:auto}
.key.zero{grid-column:span 2}
.key.act{color:var(--red);font-weight:700}
.key[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.key:active{filter:brightness(.92)}

.tb.txt{width:auto;padding:0 9px;font-weight:700;font-size:.82rem;letter-spacing:.02em}
.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#lassoPath{fill:var(--accent);fill-opacity:.07;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 5}
#selRect{fill:var(--accent);fill-opacity:.06;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 5}
.selbar{position:absolute;display:flex;gap:4px;padding:4px;background:var(--chrome);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.16);z-index:3}
.selbar[hidden]{display:none}
.selbar button{height:38px;padding:0 12px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:.92rem;white-space:nowrap}
.selbar button:hover{background:var(--chrome-2)}
.selbar .main-act{background:var(--accent);color:var(--accent-ink)}
.selbar .main-act:hover{background:var(--accent);filter:brightness(1.06)}
.selbar .del{color:var(--red)}
.selbar [hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--text);color:var(--chrome);padding:9px 14px;border-radius:10px;font-size:.92rem;max-width:min(92vw,440px);
  pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:861px){
  .app:not(.panel-open) .main{grid-template-columns:minmax(0,1fr)}
  .app:not(.panel-open) .panel{display:none}
  #panelClose{display:none}
}
@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}
  .panel{position:absolute;left:0;right:0;bottom:0;height:min(72%,580px);border-left:0;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;box-shadow:var(--sheet-shadow);transform:translateY(calc(100% + 16px));visibility:hidden;
    transition:transform .24s ease,visibility 0s linear .24s;z-index:5}
  .app.panel-open .panel{transform:none;visibility:visible;transition:transform .24s ease,visibility 0s}
  .brand{display:none}
}
@media (prefers-reduced-motion:reduce){
  .panel,.toast{transition:none !important}
}

<body>
<div class="app" id="app">
  <header class="toolbar" role="toolbar" aria-label="Writing tools">

    <div class="grp">
      <button class="tb" id="tPen" aria-label="Pen (P)" title="Pen (P)"><svg viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L9 19l-5 1 1-5z"/><path d="M13.5 6.5l4 4"/></svg></button>

      <button class="tb" id="tLasso" aria-label="Lasso select (L)" title="Lasso select (L)"><svg viewBox="0 0 24 24"><path d="M12 4c4.6 0 8.5 2.3 8.5 5.2s-3.9 5.3-8.5 5.3-8.5-2.4-8.5-5.3S7.4 4 12 4z" stroke-dasharray="3.2 2.6"/><path d="M6.5 13.2c-1.4 1.6-1.3 3.6.4 4.8 1.3.9 1.6 2 .9 3"/></svg></button>
    </div>
    <div class="grp" id="inks" aria-label="Ink colour"></div>
    <div class="grp" id="sizes" aria-label="Pen size"></div>
    <div class="grp">
      <button class="tb" id="undo" aria-label="Undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="tb" id="redo" aria-label="Redo" title="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    </div>
    <div class="grp">
      <button class="tb" id="finger" aria-label="Draw with finger" title="Draw with finger"><svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M12 10.5V9a1.5 1.5 0 0 1 3 0v2"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4 15.5a1.6 1.6 0 0 1 2.4-2.1L9 15"/></svg></button>
      <button class="tb" id="clear" aria-label="Clear page" title="Clear page"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></button>
      <button class="tb txt" id="pdfBtn" aria-label="Save all pages as PDF" title="Save all pages as PDF">PDF</button>
    </div>
    <div class="spacer"></div>
    <div class="grp">
      <button class="tb" id="prev" aria-label="Previous page" title="Previous page"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="pglabel" id="pgLabel" aria-live="polite">1 / 1</span>
      <button class="tb" id="next" aria-label="Next page" title="Next page"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="tb" id="addPage" aria-label="New page" title="New page"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="grp">
      <button class="tb" id="panelToggle" aria-label="Calculator" title="Calculator" aria-expanded="false"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7h7"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15h.01M12 15h.01M15.5 15h.01M8.5 18h.01M12 18h.01M15.5 18h.01" stroke-width="2.4"/></svg></button>
    </div>
  </header>

  <div class="main">
    <div class="board" id="board">
      <canvas id="cv" aria-label="Writing page"></canvas>
      <svg class="ov" id="ov" aria-hidden="true"><path id="lassoPath" d=""/><rect id="selRect" rx="6" visibility="hidden"/></svg>
      <div class="selbar" id="selbar" role="toolbar" aria-label="Selection" hidden>
        <button class="main-act" id="selCopy">Copy image</button>
        <button id="selShare" hidden>Share</button>
        <button id="selSave" hidden>Save image</button>
        <button class="del" id="selDel">Delete</button>
      </div>
      <div class="hint-empty" id="emptyHint">Write with a stylus or finger. Use the lasso to select an equation and copy it into Claude or ChatGPT.</div>
      <button class="totop" id="toTop" aria-label="Back to top of page" title="Back to top" hidden><svg viewBox="0 0 24 24"><path d="M12 19V6"/><path d="M6.5 11.5L12 6l5.5 5.5"/></svg></button>
    </div>

    <aside class="panel" id="panel" aria-label="Calculator">
      <div class="panel-head">
        <h2>Calculator</h2>
        <div class="head-r">
          <div class="angle" role="group" aria-label="Angle unit">
            <button id="degBtn">Deg</button><button id="radBtn">Rad</button>
          </div>
          <button class="tb" id="panelClose" aria-label="Close calculator"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
      </div>
      <div class="hist" id="hist"></div>
      <div class="display">
        <input id="expr" type="text" inputmode="none" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Expression" placeholder="0">
        <div class="preview" id="preview" aria-live="polite"></div>
      </div>
      <div class="keys" id="keys"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const app = $('#app'), board = $('#board'), cv = $('#cv'), ctx = cv.getContext('2d');
  const SIZES = [1.6, 2.6, 4.2];
  const SIZE_NAMES = ['Fine', 'Medium', 'Bold'];
  const INK_NAMES = ['Black', 'Blue', 'Red', 'Green'];
  const LIGHT_INKS = ['#1A2230', '#2346C8', '#C8312A', '#1F7A4D'];
  const KEY = 'project-notes.v1', OLD_KEY = 'margin.notebook.v1';

  /* ---------- State ---------- */
  const newPage = () => ({ strokes: [], sy: 0 });
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY) || 'null');
      if (d && Array.isArray(d.pages) && d.pages.length) return d;
    } catch (e) {}
    return null;
  }
  let state = load() || { pages: [newPage()], cur: 0, tool: 'pen', ink: 0, size: 1, finger: true, penSeen: false };
  state.cur = Math.min(Math.max(0, state.cur | 0), state.pages.length - 1);
  state.pages.forEach(p => { p.strokes ||= []; p.sy = Math.max(0, +p.sy || 0); });
  state.calc ||= { hist: [], deg: true, ans: 0 };
  if (!['pen', 'eraser', 'lasso'].includes(state.tool)) state.tool = 'pen';
  const page = () => state.pages[state.cur];

  let saveT;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(state)); }
      catch (e) { toast('Couldn’t save on this device. Storage may be full or blocked.'); }
    }, 400);
  }
  window.addEventListener('pagehide', () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} });

  const hist = new WeakMap();
  function H() { let h = hist.get(page()); if (!h) { h = { undo: [], redo: [] }; hist.set(page(), h); } return h; }

  let toastT;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
  }

  /* ---------- Drawing ---------- */
  let W = 0, Ht = 0, dpr = 1;
  function inkColors() {
    const cs = getComputedStyle(document.documentElement);
    return [0, 1, 2, 3].map(i => cs.getPropertyValue('--ink' + i).trim() || LIGHT_INKS[i]);
  }
  const pf = p => 0.45 + 1.1 * p;
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2];

  function seg(c, s, i, col) {
    const p = s.pts;
    const a = i === 1 ? p[0] : mid(p[i - 2], p[i - 1]);
    const k = p[i - 1], b = mid(p[i - 1], p[i]);
    c.beginPath(); c.moveTo(a[0], a[1]); c.quadraticCurveTo(k[0], k[1], b[0], b[1]);
    c.lineWidth = s.w * pf(k[2]); c.strokeStyle = col[s.c]; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke();
  }
  function tail(c, s, col) {
    const p = s.pts, n = p.length;
    if (n === 1) { dot(c, s, col); return; }
    const a = mid(p[n - 2], p[n - 1]), b = p[n - 1];
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]);
    c.lineWidth = s.w * pf(b[2]); c.strokeStyle = col[s.c]; c.lineCap = 'round'; c.stroke();
  }
  function dot(c, s, col) {
    const q = s.pts[0];
    c.beginPath(); c.arc(q[0], q[1], Math.max(0.8, s.w * pf(q[2]) / 2), 0, Math.PI * 2);
    c.fillStyle = col[s.c]; c.fill();
  }
  function drawStroke(c, s, col) {
    for (let i = 1; i < s.pts.length; i++) seg(c, s, i, col);
    tail(c, s, col);
  }
  function redraw() {
    const sy = page().sy || 0;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, Ht);
    ctx.setTransform(dpr, 0, 0, dpr, 0, -sy * dpr);
    const col = inkColors(), top = sy - 40, bot = sy + Ht + 40;
    for (const s of page().strokes) {
      const y = s.pts[0][1];
      if (s.pts.length < 400 && (y < top - 600 || y > bot + 600)) continue;
      drawStroke(ctx, s, col);
    }
    board.style.backgroundPosition = `0 ${-sy}px`;
    $('#toTop').hidden = sy < 4;
    $('#emptyHint').hidden = page().strokes.length > 0 || sy > 0;
    if (typeof updateSelUI === 'function') { updateSelUI(); drawLasso(); }
  }
  function resize() {
    const r = board.getBoundingClientRect();
    W = r.width; Ht = r.height; dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(Ht * dpr));
    redraw();
  }
  new ResizeObserver(resize).observe(board);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', redraw);

  let scrollSaveT;
  function setScroll(v) {
    const n = Math.max(0, Math.round(v));
    if (n === page().sy) return;
    page().sy = n; redraw();
    clearTimeout(scrollSaveT); scrollSaveT = setTimeout(save, 300);
  }
  board.addEventListener('wheel', e => { e.preventDefault(); setScroll((page().sy || 0) + e.deltaY); }, { passive: false });
  $('#toTop').onclick = () => setScroll(0);

  /* ---------- Geometry helpers ---------- */
  const r1 = n => Math.round(n * 10) / 10;
  function bboxOf(strokes) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const s of strokes) {
      const r = s.w * 1.6;
      for (const p of s.pts) {
        if (p[0] - r < x0) x0 = p[0] - r; if (p[1] - r < y0) y0 = p[1] - r;
        if (p[0] + r > x1) x1 = p[0] + r; if (p[1] + r > y1) y1 = p[1] + r;
      }
    }
    return { x0, y0, x1, y1 };
  }
  function pip(p, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
    }
    return inside;
  }
  function translate(strokes, dx, dy) {
    for (const s of strokes) for (const p of s.pts) { p[0] = r1(p[0] + dx); p[1] = r1(p[1] + dy); }
  }
  function renderStrokes(strokes, maxSide) {
    const b = bboxOf(strokes), pad = 28;
    const w = b.x1 - b.x0 + pad * 2, h = b.y1 - b.y0 + pad * 2;
    const scale = Math.max(1, Math.min(3, maxSide / Math.max(w, h)));
    const off = document.createElement('canvas');
    off.width = Math.round(w * scale); off.height = Math.round(h * scale);
    const c = off.getContext('2d');
    c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, off.width, off.height);
    c.setTransform(scale, 0, 0, scale, (pad - b.x0) * scale, (pad - b.y0) * scale);
    for (const s of strokes) drawStroke(c, s, LIGHT_INKS);
    return off;
  }

  /* ---------- Selection ---------- */
  const lassoPath = $('#lassoPath'), selRect = $('#selRect'), selbar = $('#selbar');
  let sel = null;
  const canCopy = !!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem);
  let canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'x.png', { type: 'image/png' })] })); } catch (_) {}
  $('#selCopy').hidden = !canCopy; $('#selShare').hidden = !canShare; $('#selSave').hidden = canCopy || canShare;
  if (!canCopy) $('#selShare').classList.add('main-act');
  if (!canCopy && !canShare) $('#selSave').classList.add('main-act');

  function drawLasso() {
    if (!active || active.mode !== 'lasso') { lassoPath.setAttribute('d', ''); return; }
    const sy = page().sy || 0;
    lassoPath.setAttribute('d', 'M' + active.poly.map(p => `${p[0]} ${r1(p[1] - sy)}`).join('L') + 'Z');
  }
  function updateSelUI() {
    if (!sel) { selRect.setAttribute('visibility', 'hidden'); selbar.hidden = true; return; }
    const sy = page().sy || 0, b = sel.box, g = 6;
    selRect.setAttribute('x', b.x0 - g); selRect.setAttribute('y', b.y0 - g - sy);
    selRect.setAttribute('width', b.x1 - b.x0 + 2 * g); selRect.setAttribute('height', b.y1 - b.y0 + 2 * g);
    selRect.setAttribute('visibility', 'visible');
    selbar.hidden = !!(active && active.mode === 'move');
    if (selbar.hidden) return;
    const bw = selbar.offsetWidth, bh = selbar.offsetHeight;
    let top = b.y0 - sy - g - bh - 10;
    if (top < 8) top = b.y1 - sy + g + 10;
    top = Math.min(Math.max(8, top), Ht - bh - 8);
    const left = Math.min(Math.max(8, (b.x0 + b.x1) / 2 - bw / 2), Math.max(8, W - bw - 8));
    selbar.style.left = left + 'px'; selbar.style.top = top + 'px';
  }
  function refreshSelImage() {
    if (!sel) return;
    const s = sel; s.blob = null;
    s.blobP = new Promise(res => renderStrokes(s.strokes, 1800).toBlob(b => { s.blob = b; res(b); }, 'image/png'));
  }
  function clearSel() { if (!sel) return; sel = null; updateSelUI(); }
  function finishLasso(poly) {
    lassoPath.setAttribute('d', '');
    if (poly.length < 3) return;
    let px0 = Infinity, py0 = Infinity, px1 = -Infinity, py1 = -Infinity;
    for (const p of poly) { px0 = Math.min(px0, p[0]); py0 = Math.min(py0, p[1]); px1 = Math.max(px1, p[0]); py1 = Math.max(py1, p[1]); }
    const chosen = page().strokes.filter(s => {
      let inside = 0, n = s.pts.length;
      for (const p of s.pts) if (p[0] >= px0 && p[0] <= px1 && p[1] >= py0 && p[1] <= py1 && pip(p, poly)) inside++;
      return inside > 0 && inside >= n * 0.5;
    });
    if (!chosen.length) { toast('Nothing inside the loop. Draw around the writing you want.'); return; }
    sel = { strokes: chosen, box: bboxOf(chosen) };
    refreshSelImage(); updateSelUI();
  }
  function saveBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  async function copySel() {
    if (!sel) return;
    const s = sel;
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': s.blobP })]);
      toast('Copied. Paste it into Claude or ChatGPT and ask it to continue.');
    } catch (e) {
      const b = await s.blobP;
      if (b) { saveBlob(b, 'equation.png'); toast('This browser can’t copy images, so the image was saved instead.'); }
    }
  }
  function shareSel() {
    if (!sel) return;
    if (!sel.blob) { toast('Preparing the image. Tap Share again.'); return; }
    navigator.share({ files: [new File([sel.blob], 'equation.png', { type: 'image/png' })] })
      .catch(e => { if (e && e.name !== 'AbortError') toast('Couldn’t share the image.'); });
  }
  async function saveSel() { if (!sel) return; const b = await sel.blobP; if (b) saveBlob(b, 'equation.png'); }
  function deleteSel() {
    if (!sel) return;
    const st = page().strokes, set = new Set(sel.strokes), items = [];
    for (let i = st.length - 1; i >= 0; i--) if (set.has(st[i])) { items.push({ s: st[i], i }); st.splice(i, 1); }
    sel = null; pushAction({ t: 'erase', items }); redraw(); save();
  }
  $('#selCopy').onclick = copySel; $('#selShare').onclick = shareSel;
  $('#selSave').onclick = saveSel; $('#selDel').onclick = deleteSel;
  selbar.addEventListener('pointerdown', e => e.stopPropagation());

  /* ---------- Pointer input ---------- */
  let active = null;
  const touches = new Map(); let pan = null;
  const avgY = () => { let t = 0; touches.forEach(y => t += y); return t / touches.size; };
  const startPan = () => { pan = { a: avgY(), sy: page().sy || 0 }; };

  function pos(e) {
    const r = active ? active.rect : cv.getBoundingClientRect();
    const pr = e.pointerType === 'pen' ? (e.pressure > 0 ? e.pressure : 0.5) : 0.5;
    return [r1(e.clientX - r.left), r1(e.clientY - r.top + (page().sy || 0)), Math.round(pr * 100) / 100];
  }
  function distSeg(p, a, b) {

    { l: '√', i: '√(', il: 'x²', ii: '^2', c: 'fn' },
    { l: 'xʸ', i: '^', c: 'fn', aria: 'power' },
    { l: 'π', i: 'π', c: 'fn' }, { l: 'e', i: 'e', c: 'fn' },
    { l: '7', i: '7' }, { l: '8', i: '8' }, { l: '9', i: '9' }, { l: '÷', i: '÷', c: 'op', aria: 'divide' },
    { l: '⌫', a: 'back', c: 'act', aria: 'backspace' }, { l: 'AC', a: 'clear', c: 'act', aria: 'clear' },
    { l: '4', i: '4' }, { l: '5', i: '5' }, { l: '6', i: '6' }, { l: '×', i: '×', c: 'op', aria: 'times' },
    { l: '!', i: '!', c: 'fn', aria: 'factorial' }, { l: 'Ans', i: 'Ans', c: 'fn' },
    { l: '1', i: '1' }, { l: '2', i: '2' }, { l: '3', i: '3' }, { l: '−', i: '−', c: 'op', aria: 'minus' },
    { l: '=', a: 'eq', c: 'eq', aria: 'equals' },
    { l: '0', i: '0', c: 'zero' }, { l: '.', i: '.' }, { l: '+', i: '+', c: 'op', aria: 'plus' },
  ];
  const keyBtns = KEYS.map(k => {
    const b = document.createElement('button');
    b.className = 'key ' + (k.c || ''); b.textContent = k.l; b.type = 'button';
    if (k.aria) b.setAttribute('aria-label', k.aria);
    b.addEventListener('pointerdown', e => e.preventDefault());
    b.onclick = () => press(k);
    keysEl.append(b); return { k, b };
  });
  function paintInv() {
    keyBtns.forEach(({ k, b }) => {
      if (k.a === 'inv') b.setAttribute('aria-pressed', inv);
      else if (k.il) b.textContent = inv ? k.il : k.l;
    });
  }
  function insert(text) {
    const v = exprEl.value;
    if (justEval && !v && /^[+−×÷^!]|^\^2/.test(text)) text = 'Ans' + text;
    justEval = false;
    const i = exprEl.selectionStart ?? v.length, j = exprEl.selectionEnd ?? v.length;
    exprEl.value = v.slice(0, i) + text + v.slice(j);
    const c = i + text.length; exprEl.setSelectionRange(c, c);
    updatePreview();
  }
  function press(k) {
    if (k.a === 'inv') { inv = !inv; paintInv(); return; }
    if (k.a === 'clear') { exprEl.value = ''; justEval = false; updatePreview(); return; }
    if (k.a === 'back') {
      const v = exprEl.value, i = exprEl.selectionStart ?? v.length, j = exprEl.selectionEnd ?? v.length;
      if (i !== j) { exprEl.value = v.slice(0, i) + v.slice(j); exprEl.setSelectionRange(i, i); }
      else if (i > 0) {
        const m = v.slice(0, i).match(/(asin\(|acos\(|atan\(|sin\(|cos\(|tan\(|log\(|ln\(|Ans|.)$/);
        const n = m ? m[0].length : 1;
        exprEl.value = v.slice(0, i - n) + v.slice(i); exprEl.setSelectionRange(i - n, i - n);
      }
      updatePreview(); return;
    }
    if (k.a === 'eq') { calc(); return; }
    insert(inv && k.ii ? k.ii : k.i);
    if (inv && k.ii) { inv = false; paintInv(); }
  }
  function updatePreview() {
    const v = exprEl.value.trim();
    prevEl.classList.remove('err');
    if (!v) { prevEl.textContent = ''; return; }
    try {
      const r = evaluate(v, state.calc.deg, state.calc.ans);
      prevEl.textContent = (Number.isFinite(r) && !/^[\d.]+$/.test(v)) ? '= ' + fmt(r) : '';
    } catch (_) { prevEl.textContent = ''; }
  }
  function calc() {
    const v = exprEl.value.trim(); if (!v) return;
    let r;
    try { r = evaluate(v, state.calc.deg, state.calc.ans); }
    catch (e) { prevEl.textContent = e.message === 'Incomplete' ? 'Finish the expression first' : e.message; prevEl.classList.add('err'); return; }
    if (!Number.isFinite(r)) { prevEl.textContent = 'Undefined result'; prevEl.classList.add('err'); return; }
    state.calc.hist.push({ e: pretty(v), r: fmt(r), v: r, d: state.calc.deg });
    if (state.calc.hist.length > 60) state.calc.hist.splice(0, state.calc.hist.length - 60);
    state.calc.ans = r; exprEl.value = ''; prevEl.textContent = ''; justEval = true;
    renderHist(); save();
  }
  function renderHist() {
    histEl.innerHTML = '';
    const h = state.calc.hist;
    if (!h.length) {
      const d = document.createElement('div'); d.className = 'empty';
      d.textContent = 'Your results appear here. Tap one to reuse it.';
      histEl.append(d); return;
    }
    const clr = document.createElement('button');
    clr.className = 'hist-clear'; clr.textContent = 'Clear history';
    clr.onclick = () => { state.calc.hist = []; renderHist(); save(); };
    histEl.append(clr);
    for (const it of h) {
      const b = document.createElement('button'); b.className = 'h-item'; b.type = 'button';
      const e = document.createElement('span'); e.className = 'h-e'; e.textContent = it.e;
      const r = document.createElement('span'); r.className = 'h-r'; r.textContent = '= ' + it.r;
      b.append(e, r); b.setAttribute('aria-label', `Reuse ${it.r}`);
      b.addEventListener('pointerdown', ev => ev.preventDefault());
      b.onclick = () => { justEval = false; insert(it.r.includes('×10^') ? '(' + it.r + ')' : it.r); };
      histEl.append(b);
    }
    histEl.scrollTop = histEl.scrollHeight;
  }
  function paintAngle() {
    $('#degBtn').setAttribute('aria-pressed', !!state.calc.deg);
    $('#radBtn').setAttribute('aria-pressed', !state.calc.deg);
  }
  $('#degBtn').onclick = () => { state.calc.deg = true; paintAngle(); updatePreview(); save(); };
  $('#radBtn').onclick = () => { state.calc.deg = false; paintAngle(); updatePreview(); save(); };
  exprEl.addEventListener('input', () => { justEval = false; updatePreview(); });
  exprEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); calc(); }
    else if (e.key === 'Escape') { exprEl.value = ''; updatePreview(); }
    else if (justEval && !exprEl.value && /^[+\-*/^!]$/.test(e.key)) { e.preventDefault(); insert('Ans' + ({ '-': '−', '*': '×', '/': '÷' }[e.key] || e.key)); }
  });

  syncUI(); paintInv(); paintAngle(); renderHist();
})();
</script>
</body>
</html>
